<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrarian Investor Dashboard V9</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { color: var(--accent-blue); margin-bottom: 8px; font-size: 2rem; }
        .header p { color: var(--text-muted); margin: 0; }
        .loading { text-align: center; font-size: 1.2rem; color: var(--accent-blue); padding: 40px; }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 32px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            background-color: #1e293b;
            padding: 16px 20px;
            margin: 0;
            font-size: 1.25rem;
            color: var(--accent-blue);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.9rem; }
        th { background-color: #0f172a; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        tr:hover { background-color: #334155; }
        code { background-color: #0f172a; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

        .badge { font-weight: 600; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; display: inline-block; }
        .status-strong-buy { background-color: #065f46; color: #a7f3d0; }
        .status-bleeding { background-color: #881337; color: #fecdd3; }
        .status-fomo { background-color: #991b1b; color: #fca5a5; }
        .status-neutral { background-color: #334155; color: #cbd5e1; }
        .status-tech { background-color: #1e40af; color: #bfdbfe; }

        .negative { color: #f87171; font-weight: 500; }
        .positive { color: #4ade80; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Contrarian Investor Dashboard</h1>
        <p>Live technical signals, daily changes & valuation metrics via Google Sheets API</p>
    </div>

    <div id="loading" class="loading">⏳ Fetching live market data from Google Sheets...</div>
    <div id="dashboard-content"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx7a59SNkSNUQINzOvNV46AUrvM4vCCxfvvHLzraYpsE9DqqE8VYnGKhyLOlBUyRo-6/exec";

        function formatPct(val) {
            if (val === "" || val === null || isNaN(val)) return "-";
            const num = parseFloat(val) * 100;
            const cls = num < 0 ? "negative" : "positive";
            return `<span class="${cls}">${num.toFixed(2)}%</span>`;
        }

        function formatNum(val, decimals = 2) {
            if (val === "" || val === null || isNaN(val)) return "-";
            return parseFloat(val).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function getStatusBadgeClass(status) {
            if (!status) return "status-neutral";
            if (status.includes("STRONG BUY")) return "status-strong-buy";
            if (status.includes("BLEEDING")) return "status-bleeding";
            if (status.includes("FOMO")) return "status-fomo";
            if (status.includes("TECH ROTATION")) return "status-tech";
            return "status-neutral";
        }

        function createTable(rows) {
            let html = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Asset Name</th>
                            <th>Ticker</th>
                            <th>Status</th>
                            <th>Theme</th>
                            <th>Target</th>
                            <th>Price</th>
                            <th>Today's Chg</th>
                            <th>52W High</th>
                            <th>52W Low</th>
                            <th>% Off High</th>
                            <th>% Up Low</th>
                            <th>50d MA</th>
                            <th>200d MA</th>
                            <th>% vs 200d MA</th>
                            <th>P/E</th>
                            <th>Yield</th>
                        </tr>
                    </thead>
                    <tbody>`;

            rows.forEach(r => {
                const badgeClass = getStatusBadgeClass(r[2]);
                html += `
                <tr>
                    <td><b>${r[0] || "-"}</b></td>
                    <td><code>${r[1] || "-"}</code></td>
                    <td><span class="badge ${badgeClass}">${r[2] || "⚪ NEUTRAL"}</span></td>
                    <td>${r[3] || "-"}</td>
                    <td><b>${formatPct(r[4])}</b></td>
                    <td><b>${formatNum(r[5])}</b></td>
                    <td><b>${formatPct(r[6])}</b></td>
                    <td>${formatNum(r[7])}</td>
                    <td>${formatNum(r[8])}</td>
                    <td>${formatPct(r[9])}</td>
                    <td>${formatPct(r[10])}</td>
                    <td>${formatNum(r[11])}</td>
                    <td>${formatNum(r[12])}</td>
                    <td>${formatPct(r[13])}</td>
                    <td>${formatNum(r[15])}</td>
                    <td>${formatPct(r[16])}</td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            return html;
        }

        async function loadDashboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';

                let sec1 = [], sec2 = [], sec3 = [], sec4 = [];
                let currentSection = 1;

                data.forEach(row => {
                    const name = row[0] ? row[0].toString() : "";
                    const ticker = row[1] ? row[1].toString() : "";

                    if (name.includes("Core Blue-Chips")) { currentSection = 2; return; }
                    if (name.includes("High Volatility")) { currentSection = 3; return; }
                    if (name.includes("Hyper-Speculative")) { currentSection = 4; return; }

                    if (ticker && ticker !== "Ticker" && !name.includes("STRATEGY CHEAT") && !ticker.includes("CURRENCY:")) {
                        if (currentSection === 1) sec1.push(row);
                        else if (currentSection === 2) sec2.push(row);
                        else if (currentSection === 3) sec3.push(row);
                        else if (currentSection === 4) sec4.push(row);
                    }
                });

                let contentHtml = "";

                if (sec1.length > 0) contentHtml += `<div class="section-card"><h2 class="section-title">🌐 Macro Indices & Relative Ratios <span>Target Drop: -10%</span></h2>${createTable(sec1)}</div>`;
                if (sec2.length > 0) contentHtml += `<div class="section-card"><h2 class="section-title">🔷 Core Blue-Chips & Broad Tech <span>Target Drop: -20%</span></h2>${createTable(sec2)}</div>`;
                if (sec3.length > 0) contentHtml += `<div class="section-card"><h2 class="section-title">🔶 High Volatility & Emerging Markets <span>Target Drop: -35%</span></h2>${createTable(sec3)}</div>`;
                if (sec4.length > 0) contentHtml += `<div class="section-card"><h2 class="section-title">🔥 Hyper-Speculative & Wild Assets <span>Target Drop: -50%</span></h2>${createTable(sec4)}</div>`;

                document.getElementById('dashboard-content').innerHTML = contentHtml;

            } catch (error) {
                document.getElementById('loading').innerHTML = "❌ Error fetching spreadsheet data.";
            }
        }

        loadDashboard();
    </script>
</body>
</html>
