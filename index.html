<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrarian Investor Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; text-align: center; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .loading { text-align: center; font-size: 1.2rem; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0284c7; color: white; font-weight: 600; }
        tr:hover { background-color: #334155; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; display: inline-block; }
    </style>
</head>
<body>

    <h1>📊 Contrarian ISA & SIPP Dashboard</h1>
    <p class="subtitle">Live tracking metrics via Google Sheets API</p>

    <div id="loading" class="loading">Fetching live market data...</div>
    <div id="table-container"></div>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const API_URL = "https://script.google.com/macros/s/AKfycbx7a59SNkSNUQINzOvNV46AUrvM4vCCxfvvHLzraYpsE9DqqE8VYnGKhyLOlBUyRo-6/exec";

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                let html = '<table>';
                
                // Search for the main header row (where Column A is "Asset Name")
                let headerFound = false;
                
                data.forEach((row) => {
                    if (row[0] === "Asset Name") {
                        headerFound = true;
                        html += '<thead><tr>';
                        html += `<th>${row[0]}</th><th>${row[1]}</th><th>${row[2]}</th><th>${row[3]}</th><th>${row[5]}</th><th>${row[8]}</th>`;
                        html += '</tr></thead><tbody>';
                    } else if (headerFound && row[0] && row[1] && row[0] !== "Core Blue-Chips & Tech" && row[0] !== "High Volatility & Emerging Markets") {
                        html += '<tr>';
                        html += `<td><b>${row[0]}</b></td>`;
                        html += `<td><code>${row[1]}</code></td>`;
                        html += `<td><span class="badge">${row[2]}</span></td>`;
                        html += `<td>${row[3]}</td>`;
                        html += `<td>${row[5]}</td>`;
                        html += `<td>${(row[8] * 100).toFixed(2)}%</td>`;
                        html += '</tr>';
                    }
                });
                
                html += '</tbody></table>';
                document.getElementById('table-container').innerHTML = html;
            } catch (error) {
                document.getElementById('loading').innerHTML = "❌ Error loading data. Ensure Apps Script is deployed to 'Anyone'.";
            }
        }

        loadData();
    </script>
</body>
</html>
