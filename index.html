<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrarian Investor Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #a78bfa;
            --border-color: #334155;
            
            --tier1-tint: rgba(34, 197, 94, 0.08);
            --tier2-tint: rgba(56, 189, 248, 0.08);
            --tier3-tint: rgba(251, 146, 60, 0.08);
            --tier4-tint: rgba(239, 68, 68, 0.08);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            color: var(--accent-blue);
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-blue);
            padding: 60px 20px;
        }

        /* Control Panel */
        .control-panel {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(30, 41, 59, 0.8) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .control-title {
            color: var(--accent-blue);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 20px;
        }

        .slider-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .slider-item:hover {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-blue);
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-item label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .slider-value {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
        }

        .slider-item input[type="range"] {
            width: 100%;
            height: 6px;
            cursor: pointer;
            accent-color: var(--accent-blue);
            border-radius: 3px;
            background: linear-gradient(to right, #ef4444 0%, #f97316 25%, #eab308 50%, #22c55e 75%, #10b981 100%);
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
            border: 2px solid var(--card-bg);
        }

        .slider-item input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
            border: 2px solid var(--card-bg);
        }

        .btn-reset {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(167, 139, 250, 0.1));
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(167, 139, 250, 0.2));
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        /* Section Card */
        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 28px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            padding: 18px 24px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.05) 0%, transparent 100%);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 0;
        }

        .section-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }

        .tier1 { border-left: 4px solid #22c55e; }
        .tier2 { border-left: 4px solid #38bdf8; }
        .tier3 { border-left: 4px solid #fb923c; }
        .tier4 { border-left: 4px solid #ef4444; }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th {
            background-color: #0f172a;
            color: var(--accent-blue);
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        th:hover {
            background-color: var(--border-color);
            color: #60a5fa;
        }

        th .sort-icon {
            font-size: 0.65rem;
            margin-left: 4px;
            opacity: 0.6;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        tr {
            transition: background-color 0.2s;
        }

        tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }

        .asset-name {
            font-weight: 700;
            color: var(--text-main);
        }

        code {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-strong-buy { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-bleeding { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status-fomo { background-color: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .status-tech { background-color: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .status-neutral { background-color: rgba(107, 114, 128, 0.2); color: #cbd5e1; }

        .positive { color: #22c55e; font-weight: 600; }
        .negative { color: #f87171; font-weight: 600; }

        /* Cheat Sheet */
        .cheatsheet-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-top: 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cheatsheet-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .cheatsheet-rule {
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .cheatsheet-subrule {
            margin-left: 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .cheatsheet-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 8px 0;
            line-height: 1.6;
        }

        /* Mobile */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .header h1 { font-size: 1.35rem; }
            .slider-container { grid-template-columns: 1fr; }
            
            .table-wrapper { overflow-x: auto; }
            
            th, td {
                padding: 10px;
                font-size: 0.8rem;
            }

            .details-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.15rem; }
            th { font-size: 0.65rem; }
            td { padding: 8px; }
            .status-badge { padding: 6px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Contrarian Investor Dashboard</h1>
        <p>Dynamic what-if simulation • Real-time market data</p>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="control-title">🎛️ What-If Simulation (Adjust Target Drop)</div>
        <div class="slider-container">
            <div class="slider-item">
                <div class="slider-label-row">
                    <label>Macro Indices</label>
                    <span class="slider-value" id="val-TIER1">-10%</span>
                </div>
                <input type="range" id="input-TIER1" min="-30" max="0" value="-10" step="1" oninput="handleSliderChange('TIER1', this.value)">
            </div>
            <div class="slider-item">
                <div class="slider-label-row">
                    <label>Blue-Chips & Tech</label>
                    <span class="slider-value" id="val-TIER2">-20%</span>
                </div>
                <input type="range" id="input-TIER2" min="-40" max="0" value="-20" step="1" oninput="handleSliderChange('TIER2', this.value)">
            </div>
            <div class="slider-item">
                <div class="slider-label-row">
                    <label>Volatile & EMs</label>
                    <span class="slider-value" id="val-TIER3">-35%</span>
                </div>
                <input type="range" id="input-TIER3" min="-60" max="0" value="-35" step="1" oninput="handleSliderChange('TIER3', this.value)">
            </div>
            <div class="slider-item">
                <div class="slider-label-row">
                    <label>Wild Assets</label>
                    <span class="slider-value" id="val-TIER4">-50%</span>
                </div>
                <input type="range" id="input-TIER4" min="-80" max="0" value="-50" step="1" oninput="handleSliderChange('TIER4', this.value)">
            </div>
        </div>
        <button class="btn-reset" onclick="resetDefaults()">🔄 Reset Defaults</button>
    </div>

    <div id="loading" class="loading">Loading market data...</div>
    <div id="dashboard-content"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx7a59SNkSNUQINzOvNV46AUrvM4vCCxfvvHLzraYpsE9DqqE8VYnGKhyLOlBUyRo-6/exec";

        let cheatSheetLines = [];
        let parsedData = [];
        let tierOverrides = { TIER1: -0.10, TIER2: -0.20, TIER3: -0.35, TIER4: -0.50 };
        const DEFAULT_TIER_TARGETS = { TIER1: -0.10, TIER2: -0.20, TIER3: -0.35, TIER4: -0.50 };

        let sectionSort = {
            TIER1: { col: null, asc: true },
            TIER2: { col: null, asc: true },
            TIER3: { col: null, asc: true },
            TIER4: { col: null, asc: true }
        };

        const SECTION_META = [
            { key: 'TIER1', title: '🌐 Macro Indices & Relative Ratios', tier: 'tier1' },
            { key: 'TIER2', title: '🔷 Core Blue-Chips & Broad Tech', tier: 'tier2' },
            { key: 'TIER3', title: '🔶 High Volatility & Emerging Markets', tier: 'tier3' },
            { key: 'TIER4', title: '🔥 Hyper-Speculative & Wild Assets', tier: 'tier4' }
        ];

        function formatPct(val) {
            if (val === "" || val === null || isNaN(val)) return "-";
            const num = parseFloat(val) * 100;
            return num.toFixed(2) + "%";
        }

        function formatNum(val, decimals = 2) {
            if (val === "" || val === null || isNaN(val)) return "-";
            return parseFloat(val).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function parseRawValue(val) {
            if (val === "" || val === null || val === undefined) return null;
            const num = parseFloat(val);
            return isNaN(num) ? val.toString().trim() : num;
        }

        function computeDynamicStatus(item) {
            if (item.theme === "Ratio Metric" || item.ticker.includes("INDEXNASDAQ:NDX")) {
                if (item.price === null || item.ma200 === null) return "⏳ Loading";
                return (item.price < item.ma200) ? "🔵 Tech rotation" : "⚪ Balanced";
            }

            const target = (tierOverrides[item.tierKey] !== undefined) ? tierOverrides[item.tierKey] : item.sheetTarget;
            const offHigh = item.offHigh;
            const price = item.price;
            const ma200 = item.ma200;

            if (offHigh !== null && offHigh >= -0.05) return "🔴 FOMO zone";
            if (offHigh !== null && target !== null && offHigh <= target) {
                return (price !== null && ma200 !== null && price > ma200) ? "🟢 Strong buy (Turnaround)" : "🩸 Bleeding (Watch)";
            }
            return "⚪ Neutral";
        }

        function parseSheetData(data) {
            parsedData = [];
            cheatSheetLines = [];
            let isCheatSheet = true;
            let currentTierKey = 'TIER1';

            data.forEach(row => {
                const name = row[0] ? row[0].toString().trim() : "";
                const ticker = row[1] ? row[1].toString().trim() : "";

                if (name === "Asset Name") { isCheatSheet = false; return; }
                if (isCheatSheet && name !== "") { cheatSheetLines.push(name); return; }

                if (name.includes("Core Blue-Chips")) { currentTierKey = 'TIER2'; return; }
                if (name.includes("High Volatility")) { currentTierKey = 'TIER3'; return; }
                if (name.includes("Hyper-Speculative")) { currentTierKey = 'TIER4'; return; }

                if (ticker && ticker !== "Ticker" && !ticker.includes("CURRENCY:")) {
                    parsedData.push({
                        tierKey: currentTierKey,
                        name: name || "-",
                        ticker: ticker || "-",
                        sheetTarget: parseRawValue(row[4]),
                        theme: row[3] || "-",
                        price: parseRawValue(row[5]),
                        todayChg: parseRawValue(row[6]),
                        high52: parseRawValue(row[7]),
                        low52: parseRawValue(row[8]),
                        offHigh: parseRawValue(row[9]),
                        upLow: parseRawValue(row[10]),
                        ma50: parseRawValue(row[11]),
                        ma200: parseRawValue(row[12]),
                        vsMa200: parseRawValue(row[13]),
                        pe: parseRawValue(row[15]),
                        yieldVal: parseRawValue(row[16])
                    });
                }
            });
        }

        function handleSliderChange(tierKey, val) {
            document.getElementById(`val-${tierKey}`).innerText = `${val}%`;
            tierOverrides[tierKey] = parseFloat(val) / 100;
            renderTables();
        }

        function resetDefaults() {
            tierOverrides = { ...DEFAULT_TIER_TARGETS };
            const defaults = { TIER1: -10, TIER2: -20, TIER3: -35, TIER4: -50 };
            for (let key in defaults) {
                document.getElementById(`input-${key}`).value = defaults[key];
                document.getElementById(`val-${key}`).innerText = `${defaults[key]}%`;
            }
            renderTables();
        }

        function handleSectionSort(tierKey, colKey) {
            if (sectionSort[tierKey].col === colKey) {
                sectionSort[tierKey].asc = !sectionSort[tierKey].asc;
            } else {
                sectionSort[tierKey].col = colKey;
                sectionSort[tierKey].asc = true;
            }
            renderTables();
        }

        function getStatusClass(status) {
            if (status.includes("Strong buy")) return "status-strong-buy";
            if (status.includes("Bleeding")) return "status-bleeding";
            if (status.includes("FOMO")) return "status-fomo";
            if (status.includes("rotation")) return "status-tech";
            return "status-neutral";
        }

        function renderTables() {
            let contentHtml = "";

            SECTION_META.forEach(sec => {
                const tierKey = sec.key;
                let items = parsedData.filter(i => i.tierKey === tierKey);

                if (items.length === 0) return;

                items.forEach(item => {
                    item.status = computeDynamicStatus(item);
                    item.currentTarget = (tierOverrides[item.tierKey] !== undefined) ? tierOverrides[item.tierKey] : item.sheetTarget;
                });

                const sortState = sectionSort[tierKey];
                if (sortState.col) {
                    items.sort((a, b) => {
                        let valA = a[sortState.col];
                        let valB = b[sortState.col];
                        if (valA === null) return 1;
                        if (valB === null) return -1;
                        if (typeof valA === 'string') return sortState.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        return sortState.asc ? valA - valB : valB - valA;
                    });
                }

                const getSortIcon = (colKey) => {
                    if (sortState.col !== colKey) return '<span class="sort-icon">↕</span>';
                    return sortState.asc ? '<span class="sort-icon">▲</span>' : '<span class="sort-icon">▼</span>';
                };

                const currentTargetPct = (tierOverrides[tierKey] * 100).toFixed(0);

                contentHtml += `
                <div class="section-card ${sec.tier}">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">${sec.title}</h2>
                            <p class="section-subtitle">Target drop: ${currentTargetPct}%</p>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th onclick="handleSectionSort('${tierKey}', 'name')">Asset Name ${getSortIcon('name')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'ticker')">Ticker ${getSortIcon('ticker')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'status')">Status ${getSortIcon('status')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'theme')">Theme ${getSortIcon('theme')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'currentTarget')">Target ${getSortIcon('currentTarget')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'price')">Price ${getSortIcon('price')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'todayChg')">Today's Chg ${getSortIcon('todayChg')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'high52')">52W High ${getSortIcon('high52')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'low52')">52W Low ${getSortIcon('low52')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'offHigh')">% Off High ${getSortIcon('offHigh')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'upLow')">% Up Low ${getSortIcon('upLow')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'ma50')">50d MA ${getSortIcon('ma50')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'ma200')">200d MA ${getSortIcon('ma200')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'vsMa200')">% vs 200d ${getSortIcon('vsMa200')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'pe')">P/E ${getSortIcon('pe')}</th>
                                    <th onclick="handleSectionSort('${tierKey}', 'yieldVal')">Yield ${getSortIcon('yieldVal')}</th>
                                </tr>
                            </thead>
                            <tbody>`;

                items.forEach(r => {
                    const statusClass = getStatusClass(r.status);
                    
                    contentHtml += `
                    <tr>
                        <td><b>${r.name}</b></td>
                        <td><code>${r.ticker}</code></td>
                        <td><span class="status-badge ${statusClass}">${r.status}</span></td>
                        <td>${r.theme}</td>
                        <td><span class="positive">${formatPct(r.currentTarget)}</span></td>
                        <td><b>${formatNum(r.price)}</b></td>
                        <td><span class="${r.todayChg > 0 ? 'positive' : 'negative'}">${formatPct(r.todayChg)}</span></td>
                        <td>${formatNum(r.high52)}</td>
                        <td>${formatNum(r.low52)}</td>
                        <td><span class="${r.offHigh < 0 ? 'negative' : 'positive'}">${formatPct(r.offHigh)}</span></td>
                        <td><span class="${r.upLow > 0 ? 'positive' : 'negative'}">${formatPct(r.upLow)}</span></td>
                        <td>${formatNum(r.ma50)}</td>
                        <td>${formatNum(r.ma200)}</td>
                        <td><span class="${r.vsMa200 > 0 ? 'positive' : 'negative'}">${formatPct(r.vsMa200)}</span></td>
                        <td>${formatNum(r.pe, 1)}</td>
                        <td>${formatPct(r.yieldVal)}</td>
                    </tr>`;
                });

                contentHtml += `</tbody></table></div></div>`;
            });

            // Cheat Sheet
            if (cheatSheetLines.length > 0) {
                contentHtml += `<div class="cheatsheet-card">
                    <div class="cheatsheet-title">📋 Strategy Rules & Execution Framework</div>`;
                
                cheatSheetLines.forEach(line => {
                    if (line.includes("STRATEGY CHEAT SHEET")) return;
                    if (/^\d\./.test(line)) contentHtml += `<div class="cheatsheet-rule">${line}</div>`;
                    else if (line.startsWith("-")) contentHtml += `<div class="cheatsheet-subrule">${line}</div>`;
                    else if (line.trim()) contentHtml += `<div class="cheatsheet-text">${line}</div>`;
                });

                contentHtml += `</div>`;
            }

            document.getElementById('dashboard-content').innerHTML = contentHtml;
        }

        async function loadDashboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                parseSheetData(data);
                renderTables();
            } catch (error) {
                document.getElementById('loading').innerHTML = "Error loading data. Check API URL.";
            }
        }

        loadDashboard();
    </script>
</body>
</html>
